<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0d6e63"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a3412"/>
    </marker>
  </defs>
  <rect width="1000" height="520" fill="#ffffff"/>

  <!-- forward chain -->
  <g>
    <rect x="40"  y="70" width="170" height="66" rx="5" fill="#f1f5f4" stroke="#1f2937" stroke-width="1.3"/>
    <text x="125" y="97"  text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">S0 · IFC</text>
    <text x="125" y="118" text-anchor="middle" font-size="12" fill="#4b5563">source building model</text>

    <rect x="290" y="70" width="170" height="66" rx="5" fill="#f1f5f4" stroke="#1f2937" stroke-width="1.3"/>
    <text x="375" y="97"  text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">S1 · CityJSON</text>
    <text x="375" y="118" text-anchor="middle" font-size="12" fill="#4b5563">after conversion</text>

    <rect x="540" y="70" width="170" height="66" rx="5" fill="#f1f5f4" stroke="#1f2937" stroke-width="1.3"/>
    <text x="625" y="97"  text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">S2 · PostGIS</text>
    <text x="625" y="118" text-anchor="middle" font-size="12" fill="#4b5563">as stored</text>

    <rect x="790" y="70" width="170" height="66" rx="5" fill="#f1f5f4" stroke="#1f2937" stroke-width="1.3"/>
    <text x="875" y="97"  text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">S3 · CityJSON&#8242;</text>
    <text x="875" y="118" text-anchor="middle" font-size="12" fill="#4b5563">rebuilt from database</text>
  </g>

  <line x1="212" y1="103" x2="286" y2="103" stroke="#1f2937" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="462" y1="103" x2="536" y2="103" stroke="#1f2937" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="712" y1="103" x2="786" y2="103" stroke="#1f2937" stroke-width="1.5" marker-end="url(#a)"/>

  <text x="249" y="53" text-anchor="middle" font-size="11.5" fill="#374151">tessellation,</text>
  <text x="249" y="38" text-anchor="middle" font-size="11.5" fill="#374151">georeferencing</text>
  <text x="499" y="53" text-anchor="middle" font-size="11.5" fill="#374151">geometry type,</text>
  <text x="499" y="38" text-anchor="middle" font-size="11.5" fill="#374151">CRS, tolerance</text>
  <text x="749" y="53" text-anchor="middle" font-size="11.5" fill="#374151">reconstruction</text>

  <!-- isolation boundary -->
  <line x1="750" y1="20" x2="750" y2="200" stroke="#9a3412" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="762" y="180" font-size="11.5" font-weight="bold" fill="#9a3412">isolation boundary</text>
  <text x="762" y="195" font-size="11" fill="#9a3412">separate process; database connection only;</text>
  <text x="762" y="209" font-size="11" fill="#9a3412">no access to S0, S1 or forward-pass cache</text>

  <!-- comparisons -->
  <g stroke="#0d6e63" stroke-width="1.5" fill="none">
    <path d="M125 138 L125 168 L375 168 L375 138"/>
    <path d="M375 196 L375 222 L625 222 L625 196"/>
    <path d="M625 138 L625 168 L875 168 L875 138"/>
    <path d="M125 250 L125 278 L875 278 L875 250"/>
  </g>
  <g font-size="12" fill="#0d6e63" text-anchor="middle" font-weight="bold">
    <text x="250" y="185">&#916; S0&#8594;S1</text>
    <text x="500" y="239">&#916; S1&#8594;S2</text>
    <text x="750" y="185">&#916; S2&#8594;S3</text>
    <text x="500" y="295">end-to-end survival&#160;&#160;S0&#8594;S3</text>
  </g>
  <line x1="125" y1="138" x2="125" y2="250" stroke="#0d6e63" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="875" y1="138" x2="875" y2="250" stroke="#0d6e63" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- n-cycle -->
  <path d="M875 320 L875 350 L375 350 L375 320" stroke="#1f2937" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
  <text x="625" y="370" text-anchor="middle" font-size="12" fill="#111827">
    <tspan font-weight="bold">n-cycle drift test</tspan>, n = 10 &#8212; S1 &#8594; S2 &#8594; S3 sub-loop only
  </text>
  <text x="625" y="388" text-anchor="middle" font-size="11.5" fill="#4b5563">the full chain is not invertible: no CityJSON &#8594; IFC direction exists</text>

  <!-- matching -->
  <rect x="40" y="416" width="920" height="82" rx="5" fill="#fafafa" stroke="#d1d5db"/>
  <text x="58" y="440" font-size="12.5" font-weight="bold" fill="#111827">Object matching, performed twice and independently</text>
  <text x="58" y="461" font-size="12" fill="#374151">M1 &#8212; by declared object identifier&#160;&#160;&#160;&#8226;&#160;&#160;&#160;M2 &#8212; by geometric nearest neighbour (centroid, volume as tie-break)</text>
  <text x="58" y="482" font-size="12" fill="#374151">Metrics are computed on M2 pairs. Disagreement between M1 and M2 <tspan font-weight="bold">is</tspan> the identity-loss metric &#8212; avoiding the circularity of using an identifier to measure identifier stability.</text>
</svg>
