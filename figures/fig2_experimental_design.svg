<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
  </defs>
  <rect width="1000" height="600" fill="#ffffff"/>

  <!-- LEFT: corpus arms -->
  <text x="40" y="34" font-size="13" font-weight="bold" fill="#111827" letter-spacing="0.8">GROUND TRUTH &#8212; TWO ARMS</text>

  <rect x="40" y="50" width="300" height="150" rx="5" fill="#f1f5f4" stroke="#0d6e63" stroke-width="1.4"/>
  <text x="58" y="74" font-size="13.5" font-weight="bold" fill="#0d6e63">Synthetic arm &#8212; precision</text>
  <text x="58" y="96"  font-size="11.5" fill="#374151">Parametric IFC with analytically exact volumes.</text>
  <text x="58" y="113" font-size="11.5" fill="#374151">Box; sloped-face prism; multi-storey stack;</text>
  <text x="58" y="130" font-size="11.5" fill="#374151">re-entrant plan; party-wall pair.</text>
  <text x="58" y="152" font-size="11.5" fill="#374151">Plus deliberately degenerate members:</text>
  <text x="58" y="169" font-size="11.5" fill="#374151">near-coplanar faces, sliver face, unclosed shell</text>
  <text x="58" y="186" font-size="11.5" font-style="italic" fill="#4b5563">&#8594; measures detection, not accuracy</text>

  <rect x="40" y="216" width="300" height="168" rx="5" fill="#fdf6ee" stroke="#9a3412" stroke-width="1.4"/>
  <text x="58" y="240" font-size="13.5" font-weight="bold" fill="#9a3412">Real arm &#8212; legal relevance</text>
  <text x="58" y="262" font-size="11.5" fill="#374151">Production IFC of buildings with registered</text>
  <text x="58" y="279" font-size="11.5" fill="#374151">condominium plans. Plan area is the legal</text>
  <text x="58" y="296" font-size="11.5" fill="#374151">reference for materiality claims.</text>
  <text x="58" y="322" font-size="11.5" font-weight="bold" fill="#9a3412">Confound handled explicitly:</text>
  <text x="58" y="339" font-size="11.5" fill="#374151">plan area convention (inner face / centre-line,</text>
  <text x="58" y="356" font-size="11.5" fill="#374151">balconies in or out) is recorded per plan and</text>
  <text x="58" y="373" font-size="11.5" fill="#374151">reported as a <tspan font-weight="bold">separate term</tspan>, never folded in.</text>

  <rect x="40" y="400" width="300" height="76" rx="5" fill="#fafafa" stroke="#d1d5db"/>
  <text x="58" y="424" font-size="11.5" fill="#374151">A round trip alone shows only self-consistency:</text>
  <text x="58" y="441" font-size="11.5" fill="#374151">a wrong volume can round-trip perfectly.</text>
  <text x="58" y="462" font-size="11.5" font-weight="bold" fill="#111827">Accuracy claims require the external reference.</text>

  <!-- arrow -->
  <line x1="352" y1="300" x2="392" y2="300" stroke="#1f2937" stroke-width="1.5" marker-end="url(#a2)"/>
  <text x="372" y="288" text-anchor="middle" font-size="11" fill="#4b5563">each</text>
  <text x="372" y="320" text-anchor="middle" font-size="11" fill="#4b5563">volume</text>

  <!-- RIGHT: condition ladder -->
  <text x="410" y="34" font-size="13" font-weight="bold" fill="#111827" letter-spacing="0.8">PIPELINE CONDITIONS &#8212; ABLATION LADDER</text>

  <g font-size="11.5" fill="#374151">
    <text x="418" y="72" font-weight="bold" fill="#111827">Condition</text>
    <text x="600" y="60" font-weight="bold" fill="#111827" text-anchor="middle">CRS</text>
    <text x="600" y="74" text-anchor="middle" font-size="10">4326&#8594;5235</text>
    <text x="695" y="60" font-weight="bold" fill="#111827" text-anchor="middle">Geom.</text>
    <text x="695" y="74" text-anchor="middle" font-size="10">closed solid</text>
    <text x="790" y="60" font-weight="bold" fill="#111827" text-anchor="middle">Semantics</text>
    <text x="790" y="74" text-anchor="middle" font-size="10">carrier</text>
    <text x="885" y="60" font-weight="bold" fill="#111827" text-anchor="middle">Tolerance</text>
    <text x="885" y="74" text-anchor="middle" font-size="10">metric 1 mm</text>
  </g>
  <line x1="410" y1="82" x2="960" y2="82" stroke="#9ca3af" stroke-width="1"/>

  <g font-size="12">
    <text x="418" y="107" fill="#111827" font-weight="bold">C0</text>
    <text x="448" y="107" fill="#4b5563">baseline, as-is</text>
    <text x="418" y="142" fill="#111827" font-weight="bold">C1</text>
    <text x="448" y="142" fill="#4b5563">+ CRS</text>
    <text x="418" y="177" fill="#111827" font-weight="bold">C2</text>
    <text x="448" y="177" fill="#4b5563">+ geometry type</text>
    <text x="418" y="212" fill="#111827" font-weight="bold">C3</text>
    <text x="448" y="212" fill="#4b5563">+ semantics carrier</text>
    <text x="418" y="247" fill="#111827" font-weight="bold">C4</text>
    <text x="448" y="247" fill="#4b5563">+ tolerance</text>
    <text x="418" y="282" fill="#111827" font-weight="bold">C5</text>
    <text x="448" y="282" fill="#4b5563">full profile</text>
  </g>

  <g stroke="#0d6e63" stroke-width="1.5">
    <circle cx="600" cy="103" r="8" fill="#ffffff"/><circle cx="695" cy="103" r="8" fill="#ffffff"/><circle cx="790" cy="103" r="8" fill="#ffffff"/><circle cx="885" cy="103" r="8" fill="#ffffff"/>
    <circle cx="600" cy="138" r="8" fill="#0d6e63"/><circle cx="695" cy="138" r="8" fill="#ffffff"/><circle cx="790" cy="138" r="8" fill="#ffffff"/><circle cx="885" cy="138" r="8" fill="#ffffff"/>
    <circle cx="600" cy="173" r="8" fill="#ffffff"/><circle cx="695" cy="173" r="8" fill="#0d6e63"/><circle cx="790" cy="173" r="8" fill="#ffffff"/><circle cx="885" cy="173" r="8" fill="#ffffff"/>
    <circle cx="600" cy="208" r="8" fill="#ffffff"/><circle cx="695" cy="208" r="8" fill="#ffffff"/><circle cx="790" cy="208" r="8" fill="#0d6e63"/><circle cx="885" cy="208" r="8" fill="#ffffff"/>
    <circle cx="600" cy="243" r="8" fill="#ffffff"/><circle cx="695" cy="243" r="8" fill="#ffffff"/><circle cx="790" cy="243" r="8" fill="#ffffff"/><circle cx="885" cy="243" r="8" fill="#0d6e63"/>
    <circle cx="600" cy="278" r="8" fill="#0d6e63"/><circle cx="695" cy="278" r="8" fill="#0d6e63"/><circle cx="790" cy="278" r="8" fill="#0d6e63"/><circle cx="885" cy="278" r="8" fill="#0d6e63"/>
  </g>
  <line x1="410" y1="262" x2="960" y2="262" stroke="#e5e7eb" stroke-width="1"/>

  <text x="410" y="316" font-size="11.5" fill="#374151">&#9679; profiled&#160;&#160;&#160;&#9675; baseline setting</text>

  <rect x="410" y="336" width="550" height="140" rx="5" fill="#fafafa" stroke="#d1d5db"/>
  <text x="428" y="360" font-size="12.5" font-weight="bold" fill="#111827">Why one factor at a time</text>
  <text x="428" y="382" font-size="11.5" fill="#374151">C1&#8211;C4 change a single factor from the baseline; C5 changes all four.</text>
  <text x="428" y="400" font-size="11.5" fill="#374151">This upgrades the claim from &#8220;the profile is better&#8221; to an attributable</text>
  <text x="428" y="418" font-size="11.5" fill="#374151">statement, e.g. <tspan font-style="italic">CRS accounts for most of the geometric error while</tspan></text>
  <text x="428" y="436" font-size="11.5" fill="#374151"><tspan font-style="italic">geometry type accounts for all validity failures</tspan>.</text>
  <text x="428" y="460" font-size="11.5" fill="#9a3412">Factors interact &#8212; a 1e-7&#176; grid is not a fixed metric distance &#8212; so where</text>
  <text x="428" y="476" font-size="11.5" fill="#9a3412">individual effects do not sum to C5, the interaction is reported.</text>

  <!-- footer -->
  <rect x="40" y="504" width="920" height="66" rx="5" fill="#f1f5f4" stroke="#0d6e63" stroke-width="1.2"/>
  <text x="58" y="528" font-size="12.5" font-weight="bold" fill="#0d6e63">Fully paired design</text>
  <text x="58" y="549" font-size="12" fill="#374151">Every legal volume in the corpus passes through every condition, so all comparisons are within-subject.</text>
  <text x="58" y="566" font-size="12" fill="#374151">Conditions are frozen before collection begins; if the profile changes afterwards the run is discarded and re-collected in full.</text>
</svg>
